<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SACI - Sistema ANAC</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="container">
        <div class="logo">
            <a href="index.html">
                <img src="logo.png" alt="Logo"/>
            </a>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="contact.html">Contato</a>
        </nav>
      </div>
    </header>
    <main class="container">
      <div class="content">
        <h1>Entre em contato com<br />a <span>ANAC</span></h1>
        <p>
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quisquam praesentium est quas explicabo odio qui pariatur commodi itaque tempore! Libero ea laudantium excepturi nihil ipsum debitis veritatis iusto alias eaque.
        </p>
        <form>
          <div class="form-group">
            <input type="text" name="Nome" placeholder="Nome" required />
          </div>
          <div class="form-group">
            <input type="email" name="Email" placeholder="Email" required />
          </div>
          <div class="form-group">
            <textarea id="message" name="Mensagem" rows="5" placeholder="Digite sua mensagem" required></textarea>
          </div>
          <div class="form-group">
            <button type="submit">Enviar</button>
          </div>
        </form>
      </div>
      <div class="image-container">
        <img src="banner.png" alt="Imagem Placeholder" />
      </div>
    </main>
    <footer>
        <div id="footer" class="rodape">
            <div id="footer-brasil" class="footer-logos">
                <div id="wrapper-footer-brasil">
                    <a href="http://www.acessoainformacao.gov.br/">
                        <span class="logo-acesso-footer"></span>
                    </a>
                    <a href="http://www.brasil.gov.br/"><span
                            class="logo-brasil-footer"></span>
                        </a>
                    </div>
            </div>
        </div>
    </footer>
  </body>
</html>
